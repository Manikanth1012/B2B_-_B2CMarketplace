name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # vitest.config.ts excludes *.integration.test.ts, so this stays pure
      # logic — no network, no database, no secrets.
      - name: Unit tests
        run: npm test

      # Vite inlines import.meta.env.VITE_* at build time, so this job's
      # output is deliberately not a deployable bundle — it has no credentials
      # and would throw on boot. It is here to prove the build compiles.
      # The servable bundle is the tracked dist/, built with the variables set
      # and committed alongside the source it was built from.
      - name: Build
        run: npm run build
