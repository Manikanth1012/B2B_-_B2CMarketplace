components:
  schemas:
    AttachmentRefOrValue:
      type: object
      properties:
        id:
          type: string
        href:
          type: string
        content:
          type: string
        description:
          type: string
        mimeType:
          type: string
        name:
          type: string
        url:
          type: string
        kycReferenceId:
          type: string
        modifiedUser:
          type: string
        modifiedDate:
          type: string
          format: date-time
        type:
          type: string
        createUser:
          type: string
      description: An attachment by value or by reference. An attachment complements the description of an element, for example through a document, a video, a picture.
    Characteristic:
      minLength: 1
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        valueType:
          type: string
      description: Describes a given characteristic of an object or entity through a name/value pair.
    ContactMedium:
      type: object
      properties:
        mediumType:
          type: string
        characteristic:
          $ref: '#/components/schemas/MediumCharacteristic'
      description: Indicates the contact medium that could be used to contact the party.
    Individual:
      required:
        - entityId
        - partyCharacteristic
      type: object
      properties:
        circleId:
          type: string
          description: GST number of the customer
        prgCode:
