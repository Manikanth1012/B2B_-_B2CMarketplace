openapi: 3.0.1
info:
  title: Customer Order Management - Product Ordering
  description: |
        **TMF API Reference: TMF 622 - Product Ordering Management**

        The Product Ordering API provides a standardized mechanism for placing a product order with all of the necessary order parameters. The API consists of a simple set of operations that interact with CRM/Order Negotiation systems in a consistent manner.

        A product order is created based on a product offer defined in a catalog. The product offer includes characteristics such as pricing, product options, and market. This API also provides a task-based resource to request order cancellation.

        **Product Order resource**
        - Main attributes include identifier, state, priority, related dates, related parties, and order items.
        - Order items include offering details and product characteristics with the related action (e.g., add or delete), state, delivery location, price, and price alterations.

        **Supported Operations:**
        - Retrieve one or many product orders using filter criteria
        - Partially update a product order
        - Create a new product order

        **Cancel Product Order resource**
        - Retrieve one or many cancel product orders
        - Create a cancel product order
  version: v4.0.0
